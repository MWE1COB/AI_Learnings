<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Level — Demo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='particles.js') }}" defer></script>
</head>
<body>
<img class="site-logo" src="{{ url_for('static', filename='bosch_logo.png') }}" alt="Bosch">
<div class="page-center">
  <div class="card fade-in">
    <h1 class="title">🤖 Artificial Intelligence</h1>
    <p class="subtitle">choose your difficulty level</p>
    <form method="post" id="level-form">
      <div class="level-list">
        {% for id, name in levels.items() %}
        <label class="level-option">
          <input type="radio" name="level" value="{{ id }}" required onchange="this.form.submit()">
          <span>{{ name }}</span>
        </label>
        {% endfor %}
      </div>
    </form>
  </div>
</div>
</body>
</html>
