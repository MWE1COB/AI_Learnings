<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Level — Demo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-center">
  <div class="card fade-in">
    <h1 class="title">🎯 {{ user.topic }}</h1>
    <p class="subtitle">Choose your difficulty level</p>
    <form method="post">
      <div class="level-list">
        {% for id, name in levels.items() %}
        <label class="level-option">
          <input type="radio" name="level" value="{{ id }}" required>
          <span>{{ name }}</span>
        </label>
        {% endfor %}
      </div>
      <button type="submit" class="btn-primary">Start →</button>
    </form>
  </div>
</div>
</body>
</html>
