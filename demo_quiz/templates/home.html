<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brain Tickle Challenge 🤪</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-center">
  <div class="card fade-in">
    <h1 class="title">🧠 Brain Tickle Challenge!</h1>
    <p class="subtitle">Warning: may cause brain-flexing and bragging rights. Enter your details to jump in!</p>
    <form method="post" novalidate>
      <div class="field">
        <label>Name *</label>
        <input type="text" name="name" value="{{ form.get('name', '') }}" placeholder="Your full name" required>
        {% if errors.get('name') %}<div class="error">{{ errors['name'] }}</div>{% endif %}
      </div>
      <div class="field">
        <label>NTID *</label>
        <input type="text" name="ntid" value="{{ form.get('ntid', '') }}" placeholder="e.g. abc1cob" required>
        {% if errors.get('ntid') %}<div class="error">{{ errors['ntid'] }}</div>{% endif %}
      </div>
      <button type="submit" class="btn-primary">Continue →</button>
    </form>
  </div>
</div>
</body>
</html>
